<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GearCompare · Tasarım prototipleri</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="studyo.css">
  <script src="studyo.js" type="module"></script>
</head>
<body>
  <header class="studio-header">
    <div class="container">
      <span>GearCompare</span>
      <a href="../">Mevcut site</a>
    </div>
  </header>
  <main class="container">
    <h1>Tasarım prototipleri</h1>
    <p class="intro">Bir logo ve bir site tasarımı seç. İkisini birlikte aşağıda önizle.</p>
    <section aria-labelledby="logo-title">
      <h2 id="logo-title">Logo seçenekleri</h2>
      <div id="logo-options" class="logo-options" role="group" aria-labelledby="logo-title"></div>
    </section>
    <section class="design-section" aria-labelledby="design-title">
      <h2 id="design-title">Site tasarımları</h2>
      <div id="design-options" class="design-options" role="group" aria-labelledby="design-title"></div>
      <div class="preview-toolbar">
        <div class="preview-selection" id="preview-selection" aria-live="polite"></div>
        <div class="preview-actions">
          <div class="device-switch" role="group" aria-label="Ekran boyutu">
            <button type="button" data-size="desktop" aria-pressed="true">Masaüstü</button>
            <button type="button" data-size="mobile" aria-pressed="false">Mobil</button>
          </div>
          <a id="full-preview" href="ekran.html" target="_blank" rel="noopener">Tam sayfa aç</a>
        </div>
      </div>
      <div class="preview-well">
        <iframe id="preview" title="GearCompare tasarım önizlemesi"></iframe>
      </div>
    </section>
  </main>
</body>
</html>
